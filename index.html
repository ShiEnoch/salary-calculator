<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薪資計算器</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .calculator-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #1c1c1e;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
    }

    .info-badge {
      background-color: #e5e5ea;
      color: #3a3a3c;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #3a3a3c;
      font-size: 14px;
    }

    /* iPhone 鬧鐘風格選擇器框 */
    .time-picker-container {
      display: flex;
      gap: 10px;
    }

    .picker-column {
      flex: 1;
      display: flex;
      align-items: center;
      background-color: #f2f2f7;
      border: 1px solid #d1d1d6;
      border-radius: 10px;
      padding: 0 12px;
    }

    .picker-column select {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 0;
      font-size: 16px;
      font-weight: 500;
      color: #000000;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    .picker-column span {
      font-size: 14px;
      color: #8e8e93;
      font-weight: 600;
      margin-left: 4px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      background-color: #f2f2f7;
      border: 1px solid #d1d1d6;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: #007aff;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      background: #f9f9fb;
      padding: 10px 12px;
      border-radius: 10px;
    }

    .checkbox-group input {
      width: 20px;
      height: 20px;
      accent-color: #007aff;
      cursor: pointer;
    }

    .checkbox-group label {
      margin-bottom: 0;
      cursor: pointer;
      font-weight: normal;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .result-box {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e5e5ea;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 15px;
      color: #6c6c70;
    }

    .result-item.highlight {
      font-size: 18px;
      color: #34c759;
      font-weight: bold;
      margin-top: 12px;
    }
  </style>
</head>
<body>

<div class="calculator-card">
  <h2>薪資計算器</h2>

  <div class="info-badge">
    固定扣除：勞保 $277 + 團保 $210 + 匯費 $30<br>(基本固定扣額合計 $517)
  </div>

  <div class="form-group">
    <label>工作時間（小時 / 分鐘）</label>
    <div class="time-picker-container">
      <div class="picker-column">
        <select id="hoursSelect"></select>
        <span>小時</span>
      </div>
      <div class="picker-column">
        <select id="minutesSelect"></select>
        <span>分鐘</span>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="bonus">獎金 (元)</label>
    <input type="number" id="bonus" placeholder="無則填 0" value="0" min="0">
  </div>

  <div class="form-group">
    <label for="penalty">罰金 / 扣款 (元)</label>
    <input type="number" id="penalty" placeholder="無則填 0" value="0" min="0">
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="nhiCheck">
    <label for="nhiCheck">扣除健保費 (預設代扣 $426)</label>
  </div>

  <button id="calcBtn">確認計算</button>

  <div class="result-box">
    <div class="result-item">
      <span>總薪水 (含獎金)：</span>
      <strong id="totalSalary">$ 0</strong>
    </div>
    <div class="result-item highlight">
      <span>實拿薪水：</span>
      <strong id="netSalary">$ 0</strong>
    </div>
  </div>
</div>

<script>
  // 動態生成 0 ~ 200 小時下拉選單
  const hoursSelect = document.getElementById('hoursSelect');
  for (let i = 0; i <= 200; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i;
    hoursSelect.appendChild(opt);
  }

  // 動態生成 0 ~ 59 分鐘下拉選單
  const minutesSelect = document.getElementById('minutesSelect');
  for (let i = 0; i < 60; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i < 10 ? '0' + i : i;
    minutesSelect.appendChild(opt);
  }

  document.getElementById('calcBtn').addEventListener('click', function () {
    const hourlyRate = 190; // 固定最低時薪 190 元
    const hours = parseInt(hoursSelect.value, 10) || 0;
    const minutes = parseInt(minutesSelect.value, 10) || 0;
    const bonus = parseFloat(document.getElementById('bonus').value) || 0;
    const penalty = parseFloat(document.getElementById('penalty').value) || 0;
    const hasNHI = document.getElementById('nhiCheck').checked;

    // 時間轉為總小時數（包含分鐘換算）
    const totalHours = hours + (minutes / 60);

    // 固定扣款：勞保 277 + 團保 210 + 匯費 30 = 517 元
    const fixedDeduction = 277 + 210 + 30;
    const nhiFee = hasNHI ? 426 : 0;

    // 薪資計算
    const baseSalary = Math.round(hourlyRate * totalHours);
    const totalSalary = baseSalary + bonus; // 總薪水 = 基本薪資 + 獎金
    const netSalary = totalSalary - fixedDeduction - penalty - nhiFee; // 實拿薪水

    // 渲染結果
    document.getElementById('totalSalary').textContent = '$ ' + totalSalary.toLocaleString();
    document.getElementById('netSalary').textContent = '$ ' + (netSalary < 0 ? 0 : netSalary).toLocaleString();
  });
</script>

</body>
</html>
